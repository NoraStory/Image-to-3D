[project]
name = "imageto3d"
version = "0.3.0"
description = "Image to 3D conversion tool using Doubao-Seed3D-2.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "volcengine-python-sdk[ark]>=5.0.0",
    "flask>=3.0.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
imageto3d = "imageto3d.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imageto3d"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# The project intentionally uses typing.Dict/List/Tuple for Python 3.9
# compatibility and broad exception handling in CLI boundary functions.
ignore = ["BLE001", "FA100", "UP006", "UP035", "SIM115", "SIM117"]
